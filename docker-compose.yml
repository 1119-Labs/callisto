version: '3.6'
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-explorer
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
    ports:
      - 5433:5432
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: 300m
  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: rabbitmq-explorer
    ports:
      - 5673:5672
      - 15673:15672
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../rabbitmq_data:/var/lib/rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: 300m

  hasura:
    image: hasura/graphql-engine:v2.40.0
    container_name: hasura-explorer
    ports:
      - 9005:8080
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: 300m
  callisto:
    build:
      context: ..
      dockerfile: callisto/Dockerfile
    container_name: callisto-explorer
    restart: unless-stopped
    command: callisto start --home /callisto/.callisto
    volumes:
      - ./callisto-config:/callisto/.callisto
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: 300m
